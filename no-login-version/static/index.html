<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#184c3f">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>快火评论分发 · 免登录版</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="masthead"><div class="header-inner">
    <span class="brand"><i aria-hidden="true"></i>快火<span class="slash">/</span>评论分发</span>
    <span id="view-label" class="edition">免登录版</span>
  </div></header>
  <main id="app"><p class="hint">正在读取本地任务…</p></main>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-inner">
    <header class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-action="dismiss" aria-label="关闭窗口">×</button></header>
    <div id="dialog-body"></div>
  </div></dialog>
  <template id="guide-video">
    <span class="guide-art" role="img" aria-label="打开视频，查看后回到任务页进入下一步">
      <span class="guide-scene">
        <span class="guide-screen"><span class="guide-player"><i></i></span><span class="guide-track"></span></span>
        <span class="guide-caption">打开视频</span>
      </span>
      <span class="guide-arrow">→</span>
      <span class="guide-scene">
        <span class="guide-screen"><span class="guide-lines"><i></i><i></i></span><span class="guide-tap">下一步</span></span>
        <span class="guide-caption">回到任务页</span>
      </span>
    </span>
  </template>
  <template id="guide-comment">
    <span class="guide-art" role="img" aria-label="复制分配的评论，在作品页的输入框中粘贴">
      <span class="guide-scene">
        <span class="guide-screen"><span class="guide-lines guide-selection"><i></i><i></i></span><span class="guide-tap">复制</span></span>
        <span class="guide-caption">复制评论</span>
      </span>
      <span class="guide-arrow">→</span>
      <span class="guide-scene">
        <span class="guide-screen"><span class="guide-field"><i></i></span><span class="guide-pasted">粘贴</span></span>
        <span class="guide-caption">在作品页粘贴</span>
      </span>
    </span>
  </template>
  <dialog id="guide-zoom" aria-labelledby="zoom-title">
    <div class="zoom-content">
      <header class="dialog-head"><h2 id="zoom-title">操作示意</h2><form method="dialog"><button type="submit" class="icon-button" aria-label="关闭大图">×</button></form></header>
      <div id="guide-zoom-art"></div>
    </div>
  </dialog>
  <noscript>请启用浏览器的 JavaScript 以使用本地评论分发。</noscript>
</body>
</html>
